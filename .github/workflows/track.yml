name: Preisfehler prüfen

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub erlaubt minimal 5 Minuten; in Stoßzeiten kann es später starten
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feeds auslesen und Push senden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -I tracker/track.py

      - name: Ergebnis committen
        run: |
          git config user.name "preisfehler-radar[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/deals.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Update Preisfehler $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase -q || true
            git push
          fi
